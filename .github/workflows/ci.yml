name: CI

on:
  push:
    branches: [main, 'stabilization/**', 'phase2/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Prisma / Lint / Build / Unit / E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # قيم اختبارية واضحة (ليست أسرارًا) — الاختبارات e2e تعمل بلا قاعدة بيانات
      # (PrismaService مستبدل بـ mock) وتستخدم هذه القيم لفحص fail-closed فقط
      JWT_SECRET: ci-test-secret-value-with-at-least-32-chars
      DATABASE_URL: postgresql://localhost:5432/garment_erp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Prisma lifecycle: الإقلاع يفشل بدون generate — لا يُخفى الفشل أبدًا
      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      # GF-0006: اختبارات e2e داخل CI — تعمل بلا قاعدة بيانات (mocked Prisma)
      - name: E2E tests
        run: npm run test:e2e -- --runInBand

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GF-0006: ضبط الفحص —
      # مستثنى موثق (false positives): ملفات مهارات Prisma المولدة في
      # backend/.agents/**, backend/.claude/**, backend/.windsurf/** تحتوي
      # أمثلة توثيقية placeholder مثل postgresql://USER:PASSWORD@HOST — ليست أسرارًا
      # فعلية ولا تُستخدم في أي كود تشغيلي. مصدرها أدوات توليد المهارات لا المطورين.
      # مستثنى أيضًا: docs/* (توثيق تاريخي للثغرات المغلقة) و*.example (قوالب).
      - name: Fail on hardcoded secrets / credentials in tracked files
        run: |
          set -e
          PATTERNS=(
            "erp_password_2024"
            "postgres(ql)?://[^[:space:]'\"]+:[^[:space:]'\"]+@"
            "JWT_SECRET[[:space:]]*=[[:space:]]*['\"][^'\"]{8,}['\"]"
            "Admin@123"
          )
          FAIL=0
          for P in "${PATTERNS[@]}"; do
            MATCHES=$(git grep -nE "$P" -- ':!*.example' ':!docs/*' ':!.github/*' ':!backend/.agents/**' ':!backend/.claude/**' ':!backend/.windsurf/**' || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Pattern [$P] found:"
              echo "$MATCHES"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "Secret scan FAILED — أزل الأسرار الحقيقية من الكود."
            exit 1
          fi
          echo "Secret scan passed."

  # ------------------------------------------------------------------
  # Flutter job — معطل مؤقتًا بقرار موثق:
  # الخطة المرجعية §4.4: "إذا لم يكن Flutter SDK متاحًا، أعد runner مناسبًا أو
  # فصل job موثق، لا تجاهل فحص Flutter". هذا الفصل مؤقت ويجب تفعيله قبل
  # المرحلة 8 (GF-0020). عند التفعيل: أزل التعليق واستخدم subosito/flutter-action.
