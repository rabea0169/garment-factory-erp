name: CI

on:
  push:
    branches: [main, "stabilization/**", "phase2/**"]
  pull_request:
    branches: [main, "phase3/**"]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — Prisma / Lint / Build / Unit / E2E / Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garment_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d garment_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend

    env:
      # قيم اختبارية واضحة (ليست أسرارًا) — الاختبارات e2e تعمل بلا قاعدة بيانات
      # (PrismaService مستبدل بـ mock) وتستخدم هذه القيم لفحص fail-closed فقط
      JWT_SECRET: ci-test-secret-value-with-at-least-32-chars
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/garment_erp
      GF_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/garment_erp
      GF_REQUIRE_INTEGRATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Prisma lifecycle: الإقلاع يفشل بدون generate — لا يُخفى الفشل أبدًا
      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      # GF-0006: اختبارات e2e داخل CI — تعمل بلا قاعدة بيانات (mocked Prisma)
      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Integration tests — PostgreSQL (required)
        run: npm run test:integration:required

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GF-0006: ضبط الفحص —
      # مستثنى موثق (false positives): ملفات مهارات Prisma المولدة في
      # backend/.agents/**, backend/.claude/**, backend/.windsurf/** تحتوي
      # أمثلة توثيقية placeholder مثل postgresql://USER:PASSWORD@HOST — ليست أسرارًا
      # فعلية ولا تُستخدم في أي كود تشغيلي. مصدرها أدوات توليد المهارات لا المطورين.
      # مستثنى أيضًا: docs/* (توثيق تاريخي للثغرات المغلقة) و*.example (قوالب).
      - name: Fail on hardcoded secrets / credentials in tracked files
        run: |
          set -e
          PATTERNS=(
            "erp_password_2024"
            "postgres(ql)?://[^[:space:]'\"]+:[^[:space:]'\"]+@"
            "JWT_SECRET[[:space:]]*=[[:space:]]*['\"][^'\"]{8,}['\"]"
            "Admin@123"
          )
          FAIL=0
          for P in "${PATTERNS[@]}"; do
            MATCHES=$(git grep -nE "$P" -- ':!*.example' ':!docs/*' ':!.github/*' ':!backend/.agents/**' ':!backend/.claude/**' ':!backend/.windsurf/**' || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Pattern [$P] found:"
              echo "$MATCHES"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "Secret scan FAILED — أزل الأسرار الحقيقية من الكود."
            exit 1
          fi
          echo "Secret scan passed."

  # ------------------------------------------------------------------
  # GF-0010: Flutter quality gate — the mobile client must be checked before merge.
  # ------------------------------------------------------------------
  flutter:
    name: Flutter — Analyze / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  performance:
    name: Performance — Dashboard baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garment_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d garment_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-performance-secret-value-with-at-least-32-chars
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/garment_erp
      SEED_ADMIN_PASSWORD: ci-performance-password
      DB_POOL_MAX: "20"
      PERF_LOGIN_EMAIL: admin@factory.com
      PERF_LOGIN_PASSWORD: ci-performance-password
      PERF_REQUESTS: "30"
      PERF_CONCURRENCY: "10"
      PERF_WARMUP: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
      - name: Seed disposable benchmark database
        run: npx prisma db seed
      - name: Build backend
        run: npm run build
      - name: Start backend
        run: |
          npm run start:prod > /tmp/garment-erp-performance.log 2>&1 &
          echo $! > /tmp/garment-erp-performance.pid
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/tmp/garment-erp-readiness.json; then
              cat /tmp/garment-erp-readiness.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/garment-erp-performance.log
          exit 1
      - name: Run repeatable performance benchmark
        run: npm run test:performance
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf7-dashboard-performance-${{ github.sha }}
          path: backend/test/performance/results/dashboard-load.json
          if-no-files-found: warn
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/garment-erp-performance.pid ]; then
            kill "$(cat /tmp/garment-erp-performance.pid)" || true
          fi
          cat /tmp/garment-erp-performance.log || true
