name: garment_factory_erp
description: نظام ERP لإدارة مصنع الملابس الجاهزة
publish_to: 'none'
version: 1.4.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.5.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.4.4

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.0.0

  # PDF & Printing
  pdf: ^3.11.0
  printing: ^5.12.0

  # Barcode & QR Scanner (Android Camera)
  mobile_scanner: ^7.4.0
  barcode_widget: ^2.0.4

  # Charts & Analytics
  fl_chart: ^1.2.0

  # Push Notifications
  flutter_local_notifications: ^22.3.0

  # NFC (بطاقات العمال)
  nfc_manager: ^4.2.1

  # Voice Input (الإدخال الصوتي)
  speech_to_text: ^7.4.0

  # Image & Camera
  image_picker: ^1.2.3
  cached_network_image: ^3.3.1

  # UI Utilities
  intl: ^0.20.0
  # SELIM-ERP W2: طباعة حرارية ESC/POS (BLE/USB/شبكة) + QR للإيصارات + اختيار الملفات
  flutter_thermal_printer: ^2.3.0
  qr_flutter: ^4.1.0
  file_picker: ^12.3.0
  shimmer: ^4.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^11.0.0

  # Forms & Validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.1.2

  # Utilities
  uuid: ^4.4.0
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  share_plus: ^13.3.0
  flutter_contacts: ^2.3.1

dev_dependencies:
  # SELIM-ERP W2: موكات اختبار الشاشات (XFile/PlatformFile fakes)
  cross_file: ^0.3.4+2
  plugin_platform_interface: ^2.1.4
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  injectable_generator: ^2.6.2
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  # MOBILE-F10 fix: Cairo variable font — single asset covers all weights.
  # Resolves the 100+ references to fontFamily: 'Cairo' that previously fell back
  # to Roboto (no Arabic glyphs → tofu boxes). Flutter resolves the variable
  # font's default (Regular 400) for plain text; explicit FontWeight.w700 will
  # fall back gracefully to the same asset without tofu.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf

# NOTE: تثبيت path_provider_android على 2.2.10 — الإصدار الأحدث (2.3.x) يسحب
# jni_flutter ذا الكود الأصلي C++ (يتطلب NDK كامل ~3.5GB + cmake) دون فائدة
# لهذا التطبيق. 2.2.10 يغطي نفس الواجهة البرمجية بلا كود أصلي.
dependency_overrides:
  path_provider_android: 2.2.10
