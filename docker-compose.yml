version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: garment_erp_db
    restart: always
    environment:
      POSTGRES_DB: garment_erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d garment_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: garment_erp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (اختياري - لإدارة قاعدة البيانات بصرياً)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: garment_erp_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@factory.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
